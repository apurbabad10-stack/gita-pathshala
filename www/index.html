<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>গীতা পাঠশালা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: phone game shell — welcome screen → 3 swipeable pages (Home · Journey · Rewards) with bottom nav; lessons open as a full-screen swipeable story sheet. Single bright theme by choice. */
:root{
  --sky:#EAF5FF; --sky2:#FFF4E2; --ink:#1E2A4A; --muted:#5B6787; --card:#FFFFFF; --line:#DCE6F2;
  --peacock:#1565C0; --teal:#0FA3A3; --marigold:#FFB020; --lotus:#FF5E98; --leaf:#2FA866; --sindoor:#E8572C;
  --display:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.disp{font-family:var(--display)}

/* shell */
.app{height:100%;display:flex;flex-direction:column}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
.page>.in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(10px + env(safe-area-inset-bottom,0px))}
.navin{display:flex;gap:6px;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 8px 24px rgba(21,101,192,.18)}
.nb{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:.82rem;color:var(--muted)}
.nb svg{width:24px;height:24px}
.nb[aria-current="true"]{background:var(--peacock);color:#fff}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.hello{flex:1;min-width:0}
.hello b{font-family:var(--display);font-size:1.35rem;display:block;line-height:1.2}
.hello span{color:var(--muted);font-size:.9rem}
.chip{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(30,42,74,.08)}
.chip svg{width:20px;height:20px}

/* rank card */
.rank{background:linear-gradient(135deg,var(--peacock),var(--teal));color:#fff;border-radius:22px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;position:relative;overflow:hidden}
.rank::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.badge-lvl{width:64px;height:64px;border-radius:50%;background:var(--marigold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.rank .t{min-width:0;position:relative;z-index:1}
.rank .t b{font-family:var(--display);font-size:1.2rem;display:block}
.xpbar{height:12px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--marigold);border-radius:99px;transition:width .6s}
.rank small{opacity:.9;font-variant-numeric:tabular-nums}

/* progress */
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 16px rgba(30,42,74,.06)}
.panel h3{font-family:var(--display);margin:0 0 8px;font-size:1.1rem}
.prog{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring text{font-family:var(--display)}
.bars text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--sky);border-radius:14px;padding:8px;text-align:center}
.stat b{font-family:var(--display);font-size:1.3rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}

/* section head */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sh h2{font-family:var(--display);font-size:1.3rem;margin:0}
.sh span{font-size:.85rem;color:var(--muted)}

/* swipe cards */
.deck{position:relative;height:300px;touch-action:none;user-select:none}
.vcard{position:absolute;inset:0;border-radius:26px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 10px 24px rgba(30,42,74,.18);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;overflow:hidden}
.vcard.drag{transition:none}
.vcard .no{font-family:var(--display);font-weight:700;font-size:.85rem;background:rgba(255,255,255,.25);align-self:flex-start;border-radius:99px;padding:2px 12px}
.vcard .sk{font-family:var(--display);font-size:1rem;line-height:1.5;opacity:.95;white-space:pre-line}
.vcard .mn{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.4;margin-top:auto;text-wrap:balance}
.vcard .rf{font-size:.8rem;opacity:.9}
.vcard .art{position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.22}
.deckctl{display:flex;justify-content:center;align-items:center;gap:14px}
.round{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 3px 10px rgba(30,42,74,.12);font-size:1.3rem;font-weight:700}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--peacock);width:20px;border-radius:8px}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin:0}

.cta{background:var(--sindoor);color:#fff;font-family:var(--display);font-weight:700;font-size:1.15rem;border-radius:18px;padding:14px 18px;box-shadow:0 5px 0 #B23E18;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #B23E18}
.cta.green{background:var(--leaf);box-shadow:0 5px 0 #1E7A48}
.cta.blue{background:var(--peacock);box-shadow:0 5px 0 #0D4A91}
.cta[disabled]{opacity:.45;pointer-events:none}

/* mascot bubble */
.talk{display:flex;gap:10px;align-items:flex-end}
.talk svg.m{width:70px;height:70px;flex:0 0 auto}
.bubble{background:var(--card);border-radius:18px 18px 18px 4px;padding:10px 14px;font-family:var(--display);font-weight:600;box-shadow:0 3px 10px rgba(30,42,74,.08);min-width:0}

/* journey */
.map{position:relative;margin:0 auto;width:100%;max-width:360px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;width:72px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.stone button{width:64px;height:64px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:1.5rem;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);display:grid;place-items:center;position:relative}
.stone.lock button{background:#C9D3E0!important;color:#8A97AB}
.stone.cur button{animation:pulse 1.6s infinite}
.stone .nm{font-size:.72rem;text-align:center;line-height:1.2;font-weight:600;max-width:110px}
.stars{display:flex;gap:1px}
.stars svg{width:14px;height:14px}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,176,32,.7)}50%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 12px rgba(255,176,32,0)}}
.zone{font-family:var(--display);font-weight:700;text-align:center;color:var(--peacock);position:absolute;left:0;right:0;font-size:.95rem}

/* rewards */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bdg{background:var(--card);border-radius:20px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(30,42,74,.06)}
.bdg svg{width:64px;height:64px}
.bdg b{font-family:var(--display);font-size:1rem;line-height:1.2}
.bdg span{font-size:.75rem;color:var(--muted);line-height:1.3}
.bdg.off{opacity:.55}
.bdg.off svg{filter:grayscale(1)}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--sky)}
.rk b{font-family:var(--display);flex:1}
.rk span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rk.on{background:var(--marigold)}
.rk.on span{color:var(--ink)}

/* welcome */
.welcome{position:fixed;inset:0;z-index:40;background:linear-gradient(170deg,#1565C0 0%,#0FA3A3 60%,#2FA866 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.welcome h1{font-family:var(--display);font-size:2.4rem;line-height:1.1;margin:0}
.welcome p{margin:0;max-width:30ch;opacity:.95}
.welcome svg.m{width:170px;height:170px;animation:bob 3s ease-in-out infinite}
.welcome input{width:100%;max-width:300px;padding:14px 16px;border-radius:16px;border:0;font:inherit;font-size:1.1rem;text-align:center;color:var(--ink);background:#fff}
.welcome .cta{max-width:300px}
.welcome .feat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.welcome .feat span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:.85rem}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* lesson sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--sky);display:flex;flex-direction:column}
.sheet-top{display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px}
.sheet-top .x{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:1.3rem;box-shadow:0 2px 8px rgba(30,42,74,.1)}
.steps-bar{flex:1;display:flex;gap:5px}
.steps-bar i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.steps-bar i.on{background:var(--leaf)}
.steps{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(24px + env(safe-area-inset-bottom,0px))}
.step>.in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scene{border-radius:24px;height:200px;position:relative;overflow:hidden;display:grid;place-items:center}
.scene svg{width:86%;height:86%}
.scene.pop svg{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
.scene .tap{position:absolute;bottom:8px;right:10px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;color:var(--ink)}
.lvl-tag{font-family:var(--display);font-weight:700;color:var(--peacock);font-size:.95rem}
.step h2{font-family:var(--display);font-size:1.6rem;line-height:1.25;margin:0;text-wrap:balance}
.story{font-size:1.12rem;line-height:1.8;margin:0}
.sloka-box{background:linear-gradient(135deg,#FFF1D6,#FFE2EC);border-radius:22px;padding:18px;border:2px dashed var(--marigold)}
.sloka-box .sk{font-family:var(--display);font-weight:600;color:var(--sindoor);font-size:1.08rem;line-height:1.75;white-space:pre-line;margin:0}
.sloka-box .rf{font-size:.8rem;color:var(--muted);margin-top:4px}
.easy{background:var(--card);border-radius:22px;padding:16px}
.easy b{font-family:var(--display);color:var(--leaf);display:block;margin-bottom:2px}
.lesson{background:var(--peacock);color:#fff;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center}
.lesson svg{width:44px;height:44px;flex:0 0 auto}
.lesson p{margin:0;font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.45}
.q{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;font-size:1.08rem;font-weight:500;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;gap:10px;align-items:center}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:0 0 auto}
.opt.ok{border-color:var(--leaf);background:#E3F7EC;box-shadow:0 4px 0 var(--leaf);animation:pop .5s}
.opt.ok .l{background:var(--leaf);color:#fff}
.opt.no{border-color:var(--sindoor);background:#FDE8E1;animation:shake .4s}
.opt.no .l{background:var(--sindoor);color:#fff}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback{font-family:var(--display);font-weight:700;font-size:1.05rem;min-height:1.6em;margin:0}
.result{text-align:center;align-items:center}
.bigstars{display:flex;gap:6px;justify-content:center}
.bigstars svg{width:68px;height:68px;transform:scale(0);animation:starIn .5s forwards}
.bigstars svg:nth-child(2){animation-delay:.25s;width:84px;height:84px;margin-top:-14px}
.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{60%{transform:scale(1.25)}100%{transform:scale(1)}}
.earn{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--sindoor)}
.breath{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border-radius:22px;padding:16px}
.breath .c{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#9BE3E3,var(--teal));transition:transform 4s ease-in-out}
.breath .c.big{transform:scale(1.8)}
.breath b{font-family:var(--display)}

/* toast + celebrate */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;font-family:var(--display);font-weight:600;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.xp-pop{position:fixed;z-index:61;font-family:var(--display);font-weight:800;color:var(--marigold);font-size:1.6rem;pointer-events:none;animation:rise 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.celebrate{position:fixed;inset:0;z-index:70;background:rgba(21,40,80,.72);display:grid;place-items:center;padding:24px}
.celebrate .box{background:var(--card);border-radius:28px;padding:24px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .6s}
.celebrate h2{font-family:var(--display);margin:0;font-size:1.6rem;color:var(--peacock)}
.celebrate canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* leaders */
.lb{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 4px 16px rgba(30,42,74,.06);display:flex;flex-direction:column;gap:10px}
.lb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lb-head h3{font-family:var(--display);margin:0;font-size:1.1rem}
.seg{display:flex;gap:3px;background:var(--sky);border-radius:99px;padding:3px}
.seg button{padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--peacock);color:#fff}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px}
.pd{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.15rem;border:3px solid #fff;box-shadow:0 3px 8px rgba(30,42,74,.18);flex:0 0 auto}
.pd.p1 .av{width:56px;height:56px;font-size:1.4rem}
.av.me{border-color:var(--marigold)}
.crown{width:28px;height:18px;margin-bottom:-4px}
.pd .nmx{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pd .px{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:1.2rem}
.lrows{display:flex;flex-direction:column;gap:4px}
.lrow{display:grid;grid-template-columns:24px auto 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:12px}
.lrow .av{width:32px;height:32px;font-size:.9rem;border-width:2px}
.lrow b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pos{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.lrow span{font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.lrow.me{background:#FFF1D6;box-shadow:inset 0 0 0 2px var(--marigold)}
.chal{display:flex;gap:10px;align-items:center;background:var(--sky);border-radius:16px;padding:10px 12px}
.chal p{margin:0;flex:1;min-width:0;font-size:.9rem;line-height:1.4}
.chal p b{font-family:var(--display)}
.chal .go{background:var(--sindoor);color:#fff;font-family:var(--display);font-weight:700;border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 #B23E18;white-space:nowrap}
.chal .bar{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:4px}
.chal .bar i{display:block;height:100%;background:var(--sindoor);border-radius:99px}
.sample{font-size:.7rem;color:var(--muted);margin:0}
.myrank{display:flex;gap:12px;align-items:center;background:#FFF1D6;border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--marigold)}
.rk-num{width:46px;height:46px;border-radius:14px;background:var(--marigold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;flex:0 0 auto}
.rk-num::before{content:"#";font-size:.9rem;margin-right:1px}
.myrank b{font-family:var(--display);display:block;line-height:1.2}
.myrank span{font-size:.8rem;color:var(--muted)}

/* puja */
.next{background:linear-gradient(140deg,#3B2A8C,#5C7CFA 60%,#FF8A5B);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.next .lbl{font-size:.85rem;opacity:.9}
.next .tm{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.05}
.next .cd{font-family:var(--display);font-weight:600}
.next .bellart{position:absolute;right:-8px;top:-6px;width:110px;height:110px;opacity:.25}
.next .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{background:rgba(255,255,255,.22);border-radius:99px;padding:5px 12px;font-family:var(--display);font-weight:600;font-size:.9rem;color:#fff}
.alist{display:flex;flex-direction:column;gap:10px}
.arow{background:var(--sky);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.arow .r1,.arow .r2{display:flex;gap:8px;align-items:center}

.sw{position:relative;width:52px;height:30px;flex:0 0 auto}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#C9D3E0;border-radius:99px;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--leaf)}

.sw input:focus-visible+i{outline:3px solid var(--marigold);outline-offset:2px}
.alst{background:#E3F7EC;border-radius:16px;padding:10px 12px}
.add{border:2px dashed var(--line);border-radius:18px;padding:12px;font-family:var(--display);font-weight:700;color:var(--peacock)}
.tlist{display:grid;grid-template-columns:1fr;gap:10px}
.tcard{border-radius:20px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:8px}
.tcard .h{display:flex;align-items:center;gap:10px}
.tcard .h b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.2}
.tcard .h span{font-size:.8rem;opacity:.9}
.tcard .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.tcard .ic svg{width:28px;height:28px}
.play{margin-left:auto;background:#fff;color:var(--ink);font-family:var(--display);font-weight:700;border-radius:99px;padding:6px 14px;white-space:nowrap}

.mt{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.mt span{padding:0 4px;border-radius:8px;transition:background .15s,transform .15s}
.mt span.on{background:#fff;color:var(--ink);transform:scale(1.12)}
.ringer{position:fixed;inset:0;z-index:80;background:linear-gradient(170deg,#3B2A8C,#5C7CFA);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.ringer .bigbell{width:110px;height:110px;animation:swing 1s ease-in-out infinite;transform-origin:50% 10%}
@keyframes swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.ringer h2{font-family:var(--display);font-size:1.8rem;margin:0}
.ringer .tm{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1}
.ringer .mt{justify-content:center;max-width:340px}
.ringer .cta{max-width:320px}
.ringer .soft{background:rgba(255,255,255,.2);color:#fff;border-radius:16px;padding:10px 18px;font-family:var(--display);font-weight:600}
/* library + reader */
.cont{background:linear-gradient(135deg,#FF8A5B,#E8572C);color:#fff;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.cont .t{flex:1;min-width:0}.cont small{opacity:.9;display:block}.cont b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.3}
.cont .sk1{font-family:var(--display);font-size:.9rem;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .go{background:#fff;color:var(--sindoor);font-family:var(--display);font-weight:700;border-radius:14px;padding:8px 14px;white-space:nowrap}
.srch{width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:inherit;color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cc{border-radius:20px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:118px;position:relative;overflow:hidden}
.cc .num{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1}
.cc b{font-family:var(--display);font-size:1rem;line-height:1.25}
.cc span{font-size:.75rem;opacity:.92}
.cc .pb{height:6px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:auto}
.cc .pb i{display:block;height:100%;background:#fff;border-radius:99px}
.cc .art{position:absolute;right:-14px;top:-10px;width:80px;height:80px;opacity:.22}

.vb{aspect-ratio:1;border-radius:14px;background:var(--card);font-family:var(--display);font-weight:700;font-size:1rem;box-shadow:0 2px 6px rgba(30,42,74,.08);position:relative;display:grid;place-items:center;max-width:100%}
.vb.read{background:#E3F7EC;color:#1E7A48}
.vb.na{color:#A9B4C6}

.rd-top{display:flex;align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px}

.ib{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(30,42,74,.1);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:0 0 auto}
.ib.fav{color:var(--lotus)}
.rd-body{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(90px + env(safe-area-inset-bottom,0px));touch-action:pan-y}

.sec{background:var(--card);border-radius:18px;padding:14px 16px}
.sec h4{margin:0 0 4px;font-family:var(--display);color:var(--peacock);font-size:.95em}
.sec p{margin:0;white-space:pre-line;line-height:1.85}
.sec.tr{background:#EAF5FF;border-left:5px solid var(--peacock)}
.sec.tr p{font-weight:500}
.sec.song p{font-family:var(--display);font-weight:600;color:#6A3FB5;text-align:center}
.sec details summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--peacock);list-style:none;display:flex;justify-content:space-between}

.rd-nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--sky) 35%)}
.rd-nav .cta{max-width:240px;font-size:1rem;padding:11px 14px}
.notice{background:#FFF4E2;border:2px dashed var(--marigold);border-radius:16px;padding:12px 14px;font-size:.9rem}
.flist{display:flex;flex-direction:column;gap:10px}
.fi{background:var(--card);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 10px rgba(30,42,74,.06);width:100%}
.fi .r{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:700;color:var(--peacock)}
.fi .s{font-family:var(--display);color:var(--sindoor);white-space:pre-line;line-height:1.6}
.fi .m{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heart{background:none;font-size:1.3rem;color:var(--lotus);line-height:1;padding:4px}
.vcard .hb{position:absolute;right:14px;bottom:12px;background:rgba(255,255,255,.25);border-radius:99px;width:38px;height:38px;color:#fff;font-size:1.2rem;z-index:2}
.modal{position:fixed;inset:0;z-index:90;background:rgba(21,40,80,.6);display:grid;place-items:center;padding:24px}
.modal .box{background:var(--card);border-radius:24px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal h3{font-family:var(--display);margin:0;color:var(--peacock)}
.modal input{padding:12px;border-radius:12px;border:2px solid var(--line);font:inherit;font-size:1.2rem;text-align:center}
.mode-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-row .tag{background:var(--peacock);color:#fff;border-radius:99px;padding:3px 12px;font-family:var(--display);font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  5:`<path d="M10 116 q30-8 60 0 t60 0 t60 0 v24 h-180z" fill="#ffffff55"/>${[-60,-30,0,30,60].map(a=>`<ellipse cx="100" cy="72" rx="13" ry="34" fill="#FF8FB8" transform="rotate(${a} 100 106)"/>`).join("")}<circle cx="100" cy="100" r="9" fill="#FFB020"/><ellipse cx="150" cy="118" rx="28" ry="8" fill="#2FA866"/><circle cx="146" cy="113" r="3" fill="#A8E0FF"/><circle cx="156" cy="115" r="2.5" fill="#A8E0FF"/>`,
  6:`<circle cx="100" cy="74" r="56" fill="#ffffff33"/><circle cx="100" cy="74" r="40" fill="#ffffff33"/><circle cx="100" cy="46" r="14" fill="#FFE2C4"/><path d="M100 60 l26 46 h-52z" fill="#FFB020"/><ellipse cx="100" cy="110" rx="40" ry="10" fill="${W}"/><path d="M92 46 h4 M104 46 h4" stroke="#1E2A4A" stroke-width="2" stroke-linecap="round"/>`,

  8:`<path d="M60 92 q40 30 80 0z" fill="#FFB020"/><ellipse cx="100" cy="92" rx="40" ry="7" fill="#E09400"/><path d="M100 86 q-14-22 0-48 q14 26 0 48z" fill="#FFE08A"/><path d="M100 84 q-6-12 0-26 q6 14 0 26z" fill="#FF8A5B"/>${ray(100,60,36,46,9,"#ffffff88")}`,

  10:`<path d="M10 120 l50-80 30 40 25-30 75 70z" fill="${W}"/><path d="M60 40 l12 20 -10-4 -8 6z" fill="#A8E0FF"/><path d="M90 128 q20-20 10-40 q30 20 20 40z" fill="#4DA3FF"/><circle cx="160" cy="34" r="14" fill="#FFB020"/>`,

  13:`<rect x="10" y="96" width="180" height="40" rx="10" fill="#8B5E3C"/>${[30,70,110,150].map(x=>`<g><line x1="${x}" y1="100" x2="${x}" y2="70" stroke="#2FA866" stroke-width="4"/><path d="M${x} 78 q-14-4 -16-16 q14 2 16 16z M${x} 72 q14-4 16-16 q-14 2 -16 16z" fill="#2FA866"/></g>`).join("")}<circle cx="168" cy="30" r="14" fill="#FFB020"/>`,

function cardHTML(c,i,depth){
  const col=COLORS[(c.n-1)%COLORS.length];
  const first=c.sk.split("\n")[0];
  return `<div class="vcard" data-i="${i}" style="background:${col};z-index:${10-depth};transform:translateY(${depth*12}px) scale(${1-depth*.05});${depth>2?"opacity:0":""}" ${depth?`aria-hidden="true"`:""}>
   <div class="art">${motif(c.n)}</div>
   <span class="no">শ্লোক ${c.ref}</span>
   <div class="sk">${first}…</div>
   <div class="mn">${c.easy}</div>
   <div class="rf">${c.t} · অধ্যায় ${BN(c.n)}</div>
   ${depth===0?`<button class="hb" data-fav="${idFromRef(c.ref)}" aria-label="প্রিয়তে যোগ করুন">${isFav(idFromRef(c.ref))?"♥":"♡"}</button>`:""}</div>`;
}
function renderDeck(){
  const deck=$("#deck");if(!deck)return;
  deck.innerHTML=deckOrder.slice(0,4).map((ci,d)=>cardHTML(CARDS[ci],ci,d)).reverse().join("");
  $("#dots").innerHTML=CARDS.map((_,i)=>`<i class="${i===deckOrder[0]?"on":""}"></i>`).join("");
  markSeen(deckOrder[0]);
  const top=deck.querySelector(`.vcard[data-i="${deckOrder[0]}"]`);
  const hb=top.querySelector(".hb");if(hb){hb.addEventListener("pointerdown",e=>e.stopPropagation());hb.onclick=e=>{e.stopPropagation();toggleFav(hb.dataset.fav);hb.textContent=isFav(hb.dataset.fav)?"♥":"♡";const fc=$("#favChip");if(fc)fc.lastChild.textContent=BN(S.fav.length)}}
  let sx=0,dx=0,drag=false;
  top.addEventListener("pointerdown",e=>{drag=true;sx=e.clientX;dx=0;top.classList.add("drag");top.setPointerCapture(e.pointerId)});
  top.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;top.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`});
  const end=()=>{if(!drag)return;drag=false;top.classList.remove("drag");
    if(Math.abs(dx)>80)flyTop(dx>0?1:-1);else top.style.transform="";};
  top.addEventListener("pointerup",end);top.addEventListener("pointercancel",end);
}
function flyTop(dir){
  const top=$(`#deck .vcard[data-i="${deckOrder[0]}"]`);if(!top)return;
  top.style.transform=`translateX(${dir*window.innerWidth}px) rotate(${dir*30}deg)`;top.style.opacity="0";
  setTimeout(()=>{deckOrder.push(deckOrder.shift());renderDeck()},280);
}
function markSeen(ci){
  const id=CARDS[ci].ref;if(S.cards.includes(id))return;
  S.cards.push(id);const up=addXP(2);
  const c=document.querySelector(".stat:nth-child(2) b");if(c)c.textContent=BN(S.cards.length);
  if(up!=null)celebrate("নতুন পদমর্যাদা!",RANKS[up][1],"তুমি এখন একজন "+RANKS[up][1]+"।");
}

/* ---------- journey map ---------- */
function renderMap(){
  if(isFullMode()){renderLibrary();return}
  const step=104,top=60,H=top+L.length*step+40;
  const pos=L.map((l,i)=>({x:50+30*Math.sin(i*1.05),y:top+i*step}));
  let d=`M ${pos[0].x} ${pos[0].y+32}`;
  for(let i=1;i<pos.length;i++){const a=pos[i-1],b=pos[i];d+=` C ${a.x} ${a.y+32+step/2}, ${b.x} ${b.y+32-step/2}, ${b.x} ${b.y+32}`}
  const curN=(L.find(l=>!S.done[l.n])||{}).n;
  $("#map").innerHTML=`
  <div class="sh"><h2>গীতার যাত্রাপথ</h2><span>${BN(doneCount())}/১৮ স্তর</span></div>
  <div class="talk">${mascot()}<div class="bubble">প্রতিটি পাথর একটি স্তর। গল্প পড়ো, প্রশ্নের উত্তর দাও, তারা জেতো!</div></div>
  <div class="map" style="height:${H}px">
    <svg class="path" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#C9D8EA" stroke-width="2.4" stroke-dasharray="1 3" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:8px"/></svg>
    ${ZONES.map(z=>`<div class="zone" style="top:${pos[z[0]-1].y-48}px">— ${z[1]} —</div>`).join("")}
    ${L.map((l,i)=>{const lk=!unlocked(l.n),st=S.done[l.n]||0,col=COLORS[i%COLORS.length];
      return `<div class="stone ${lk?"lock":""} ${l.n===curN?"cur":""}" style="left:${pos[i].x}%;top:${pos[i].y}px">
      <button data-l="${l.n}" style="background:${col}" aria-label="স্তর ${BN(l.n)}: ${l.t}${lk?" (বন্ধ)":""}">${lk?`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`:BN(l.n)}</button>
      <div class="stars">${[1,2,3].map(k=>STAR(k<=st)).join("")}</div>
      <div class="nm">${l.t}</div></div>`}).join("")}
  </div>`;
  document.querySelectorAll(".stone button").forEach(b=>b.onclick=()=>{const n=+b.dataset.l;unlocked(n)?openLesson(n):toast("আগে স্তর "+BN(n-1)+" শেষ করো!")});
}

  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;fl.type="lowpass";fl.frequency.value=2200;
  lf.frequency.value=5.2;lg.gain.value=f*.007;lf.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.07);g.gain.setValueAtTime(vol,t+Math.max(.08,d-.1));g.gain.exponentialRampToValueAtTime(.0005,t+d+.3);
  const g2=AC.createGain();g2.gain.value=.25;o.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);g.connect(out);
  [o,o2,lf].forEach(x=>{x.start(t);x.stop(t+d+.35)})}
function drone(out,t,d){[[SA/2,.045],[SA*.75,.035],[SA,.022]].forEach(([f,v])=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.value=650;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.8);g.gain.setValueAtTime(v,t+d-.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)})}
function noise(){if(NB)return NB;const b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB=b}
function kartal(out,t,v=.22){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type="highpass";f.frequency.value=5500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+.2)}
function drum(out,t,v=.32){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(55,t+.25);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(out);o.start(t);o.stop(t+.45)}
function bell(out,t,f=520,v=.2){[[1,1],[2.76,.5],[5.4,.28],[8.93,.14]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f*m;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+3.6/Math.sqrt(m));o.connect(g);g.connect(out);o.start(t);o.stop(t+4)})}
function conch(out,t){const o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain();
  o.type="sawtooth";o2.type="square";o.frequency.setValueAtTime(233,t);o.frequency.setValueAtTime(233,t+2.3);o.frequency.linearRampToValueAtTime(262,t+3);o2.frequency.value=116.5;
  f.type="lowpass";f.frequency.value=1000;f.Q.value=4;lf.frequency.value=4.5;lg.gain.value=3;lf.connect(lg);lg.connect(o.frequency);
  const g2=AC.createGain();g2.gain.value=.3;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.7);g.gain.setValueAtTime(.15,t+2.8);g.gain.linearRampToValueAtTime(0,t+3.4);
  o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(out);[o,o2,lf].forEach(x=>{x.start(t);x.stop(t+3.5)})}

    let p=await LN.checkPermissions();if(p.display!=="granted")p=await LN.requestPermissions();alarmState.perm=p.display;
    try{const ex=await LN.checkExactNotificationSetting();exactOK=ex.exact_alarm==="granted"}catch(e){}
    LN.addListener("localNotificationActionPerformed",ev=>{
      const id=ev.notification&&ev.notification.extra&&ev.notification.extra.alarmId;
      const a=S.alarms.find(x=>x.id===id);if(a){goPage(2);setTimeout(()=>ring(a),500)}
    });
    await nativeSchedule();renderPuja();
  }catch(e){alarmState.err=String(e&&e.message||e);renderPuja()}
}
async function nativeSchedule(){
  if(!LN)return;
  try{
    const pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=S.alarms.filter(a=>a.on).map((a,i)=>{const[h,m]=a.time.split(":").map(Number);
      return {id:1000+i,title:a.label+"-র সময় হয়েছে",body:TONES[a.tone].name+" · ছুঁয়ে অ্যাপ খোলো",
        channelId:"alarm_"+a.tone,sound:a.tone+".wav",smallIcon:"ic_stat_bell",iconColor:"#1565C0",
        schedule:{on:{hour:h,minute:m},allowWhileIdle:true},extra:{alarmId:a.id}}});
    if(list.length)await LN.schedule({notifications:list});
    const after=await LN.getPending();alarmState.pending=(after.notifications||[]).length;alarmState.err="";
  }catch(e){alarmState.err=String(e&&e.message||e);toast("অ্যালার্ম সেট করা যায়নি: অনুমতি দেখুন")}
  const st=$("#alSt");if(st)st.innerHTML=alarmStatusHTML();
}
function alarmStatusHTML(){
  if(!NATIVE)return "";
  const ok=alarmState.perm==="granted"&&!alarmState.err;
  return `<div class="${ok?"alst":"notice"}" style="font-size:.88rem;display:flex;flex-direction:column;gap:4px">
    <b style="font-family:var(--display)">${ok?"✓ ফোনের অ্যালার্ম চালু":"⚠ অ্যালার্মে সমস্যা"}</b>
    <span>নোটিফিকেশন অনুমতি: ${alarmState.perm==="granted"?"আছে":"নেই"} · ঠিক সময়ে বাজানোর অনুমতি: ${exactOK?"আছে":"নেই"} · সেট করা অ্যালার্ম: ${BN(alarmState.pending)}টি</span>
    ${alarmState.err?`<span>ত্রুটি: ${alarmState.err}</span>`:""}</div>`;
}
async function testAlarm(){
  if(!LN){toast("ফোনে ইনস্টল করা অ্যাপে এটি কাজ করবে");return}
  try{const a=S.alarms[0]||{id:"t",label:"পরীক্ষা",tone:"bell"};
    await LN.schedule({notifications:[{id:999,title:"পরীক্ষামূলক অ্যালার্ম",body:"অ্যালার্ম ঠিকমতো কাজ করছে · ছুঁয়ে অ্যাপ খোলো",
      channelId:"alarm_"+a.tone,sound:a.tone+".wav",smallIcon:"ic_stat_bell",iconColor:"#1565C0",
      schedule:{at:new Date(Date.now()+60000),allowWhileIdle:true},extra:{alarmId:a.id}}]});
    toast("১ মিনিট পরে বাজবে। এখন অ্যাপ বন্ধ করে দেখো।")}catch(e){alarmState.err=String(e&&e.message||e);renderPuja();toast("পরীক্ষা ব্যর্থ: অনুমতি দেখুন")}
}
async function fixAlarmPermission(){
  if(!LN)return;
  try{await LN.requestPermissions();await LN.changeExactNotificationSetting();
    const ex=await LN.checkExactNotificationSetting();exactOK=ex.exact_alarm==="granted";await nativeSchedule();renderPuja();
    toast(exactOK?"অ্যালার্মের অনুমতি ঠিক আছে":"সেটিংসে 'অ্যালার্ম ও রিমাইন্ডার' চালু করো")}catch(e){toast("ফোনের সেটিংসে নোটিফিকেশন চালু করো")}
}

/* ---------- puja alarms ---------- */
const PERIOD=h=>h<4?"রাত":h<12?"সকাল":h<16?"দুপুর":h<18?"বিকেল":h<20?"সন্ধ্যা":"রাত";
function fmtTime(t){const[h,m]=t.split(":").map(Number);const h12=h%12||12;return PERIOD(h)+" "+BN(h12)+":"+BN(String(m).padStart(2,"0"))}
function nextAlarm(){const now=new Date();let best=null;
  S.alarms.filter(a=>a.on).forEach(a=>{const[h,m]=a.time.split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);if(d<=now)d.setDate(d.getDate()+1);if(!best||d<best.d)best={a,d}});return best}
function cdText(){const nx=nextAlarm();if(!nx)return "";const mins=Math.ceil((nx.d-new Date())/60000),h=Math.floor(mins/60),m=mins%60;
  return "আর "+(h?BN(h)+" ঘণ্টা ":"")+BN(m)+" মিনিট বাকি"}
function renderPuja(){
  const el=$("#puja");if(!el)return;
  const nx=nextAlarm(),doneToday=S.pujaDays.includes(todayKey());
  el.innerHTML=`
  <div class="sh"><h2>পূজার সময়</h2><span>${BN(S.pujaDays.length)} দিন পূজা করেছ</span></div>
  <div class="next">
    <svg class="bellart" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><path d="M9 22V15a7 7 0 0 1 14 0v7l2 2H7z"/><path d="M14 27h4M16 4v4"/></svg>
    ${nx?`<div class="lbl">পরের পূজা · ${nx.a.label}</div><div class="tm">${fmtTime(nx.a.time)}</div><div class="cd" id="cd">${cdText()}</div>
    <div class="row"><span class="pill">${TONES[nx.a.tone].name}</span><button class="pill" id="testRing">▶ এখনই বাজিয়ে দেখো</button></div>`
    :`<div class="lbl">কোনো অ্যালার্ম চালু নেই</div><div class="cd">নিচে পূজার সময় যোগ করো বা চালু করো।</div>`}
  </div>
  <button class="cta ${doneToday?"green":""}" id="pujaDone">${doneToday?"✓ আজকের পূজা হয়েছে":"আজ পূজা করেছি · +৫ XP"}</button>
  <div class="panel"><h3>আমার পূজার অ্যালার্ম</h3><div class="alist">
    ${S.alarms.map(a=>`<div class="arow" data-a="${a.id}">
      <div class="r1"><input type="time" id="t-${a.id}" value="${a.time}" aria-label="সময়"><input type="text" id="l-${a.id}" value="${a.label}" aria-label="নাম" maxlength="24">
        <label class="sw"><input type="checkbox" id="o-${a.id}" ${a.on?"checked":""} aria-label="চালু/বন্ধ"><i></i></label></div>
      <div class="r2"><select id="s-${a.id}" aria-label="অ্যালার্মের ধ্বনি">${Object.entries(TONES).map(([k,v])=>`<option value="${k}" ${k===a.tone?"selected":""}>${v.name}</option>`).join("")}</select>
        <button class="del" aria-label="মুছে ফেলো">×</button></div></div>`).join("")}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="add" id="addA">+ পূজার সময়</button><button class="add" id="addL">+ পাঠের সময়</button></div>
    ${NATIVE&&(!exactOK||alarmState.perm!=="granted")?`<button class="cta" id="fixPerm" style="font-size:1rem">অ্যালার্মের অনুমতি দাও</button>`:""}
    ${NATIVE?`<div id="alSt">${alarmStatusHTML()}</div><button class="cta blue" id="testAl" style="font-size:1rem">১ মিনিট পরে পরীক্ষা অ্যালার্ম</button>`:""}</div></div>
  <div class="sh"><h2>ভক্তি ধ্বনি</h2><span>শুনুন ও সঙ্গে গাও</span></div>
  <div class="tlist">${Object.entries(TONES).map(([k,v])=>`<div class="tcard" style="background:${v.col}">
    <div class="h"><div class="ic">${TICON[k]}</div><div style="min-width:0"><b>${v.name}</b><span>${v.kind}</span></div><button class="play" data-play="${k}" aria-pressed="false">▶ শুনুন</button></div>
    ${mtHTML(k)}</div>`).join("")}</div>
  <p class="sample">${NATIVE?"অ্যাপ বন্ধ থাকলেও ফোন নির্ধারিত সময়ে অ্যালার্ম বাজাবে। নোটিফিকেশন ছুঁলে অ্যাপ খুলে পূজা বা পাঠ শুরু হবে।":"ব্রাউজারে অ্যাপটি খোলা থাকলে অ্যালার্ম বাজবে। ফোনে ইনস্টল করা অ্যাপে বন্ধ থাকলেও বাজবে।"} সুরগুলো এই অ্যাপের নিজস্ব।</p>`;
  el.querySelectorAll(".arow").forEach(r=>{const id=r.dataset.a,a=S.alarms.find(x=>x.id===id);
    const upd=()=>{a.time=$("#t-"+id).value||a.time;a.label=$("#l-"+id).value.trim()||"পূজা";a.on=$("#o-"+id).checked;a.tone=$("#s-"+id).value;save();nativeSchedule();const c=$("#cd");if(c)c.textContent=cdText()};
    r.querySelectorAll("input,select").forEach(i=>i.addEventListener("change",upd));
    $("#o-"+id).addEventListener("change",()=>{upd();renderPuja();toast(a.on?a.label+" চালু হলো":a.label+" বন্ধ হলো")});
    r.querySelector(".del").onclick=()=>{S.alarms=S.alarms.filter(x=>x.id!==id);save();nativeSchedule();renderPuja();toast("অ্যালার্ম মুছে ফেলা হলো")};
  });
  $("#addA").onclick=()=>{S.alarms.push({id:"a"+Date.now(),label:"পূজা",time:"12:00",tone:"bell",on:true,kind:"puja"});save();nativeSchedule();renderPuja()};
  $("#addL").onclick=()=>{S.alarms.push({id:"a"+Date.now(),label:"গীতা পাঠের সময়",time:"17:00",tone:"bell",on:true,kind:"learn"});save();nativeSchedule();renderPuja();toast("পাঠের অ্যালার্ম যোগ হলো")};
  const fx=$("#fixPerm");if(fx)fx.onclick=fixAlarmPermission;
  const ta=$("#testAl");if(ta)ta.onclick=testAlarm;
  el.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{player&&player.id===b.dataset.play?stopTone():playTone(b.dataset.play)});
  const tr=$("#testRing");if(tr)tr.onclick=()=>ring(nx.a);
  $("#pujaDone").onclick=e=>markPuja(e);
  updatePlay();
}
function markPuja(e){
  const k=todayKey();if(S.pujaDays.includes(k)){toast("আজকের পূজা আগেই হয়ে গেছে");return}
  S.pujaDays.push(k);const r=e&&e.currentTarget?e.currentTarget.getBoundingClientRect():{right:innerWidth/2+40,top:innerHeight/2};
  const up=addXP(5,r.right-40,r.top);toast("জয় শ্রীকৃষ্ণ! আজকের পূজা হলো");renderPuja();renderHome();
  if(up!=null)setTimeout(()=>celebrate("নতুন পদমর্যাদা!",RANKS[up][1],"তুমি এখন একজন "+RANKS[up][1]+"।"),900);
}
let snooze=null;const fired=new Set();
function ring(a){
  const old=$("#ringer");if(old)old.remove();
  const o=document.createElement("div");o.className="ringer";o.id="ringer";o.setAttribute("role","alertdialog");o.setAttribute("aria-label",a.label);
  o.innerHTML=`<svg class="bigbell" viewBox="0 0 32 32" fill="#FFB020" stroke="#fff" stroke-width="1.5"><path d="M9 22V15a7 7 0 0 1 14 0v7l2 2H7z"/><circle cx="16" cy="27" r="2"/><path d="M16 4v4" fill="none"/></svg>
    <h2>${a.label}-র সময় হয়েছে</h2><div class="tm">${fmtTime(a.time)}</div><div>${TONES[a.tone].name}</div>${mtHTML(a.tone)}
    <button class="cta green" id="rStart">${a.kind==="learn"?"পাঠ শুরু করি":"পূজা শুরু করি"}</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="soft" id="rSnooze">৫ মিনিট পরে</button><button class="soft" id="rSound">শব্দ শুনতে চাপো</button></div>`;
  document.body.appendChild(o);playTone(a.tone);
  const close=()=>{stopTone();o.remove()};
  $("#rStart").onclick=e=>{close();if(a.kind==="learn"){const n=L.find(l=>!S.done[l.n]);n?openLesson(n.n):goPage(1)}else markPuja(e)};
  $("#rSnooze").onclick=()=>{close();snooze={a,t:Date.now()+300000};toast("৫ মিনিট পরে আবার মনে করাব")};
  $("#rSound").onclick=()=>playTone(a.tone);
}
setInterval(()=>{
  const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  S.alarms.forEach(a=>{const k=a.id+todayKey()+a.time;if(a.on&&a.time===hm&&!fired.has(k)){fired.add(k);ring(a)}});
  if(snooze&&Date.now()>=snooze.t){const a=snooze.a;snooze=null;ring(a)}
  const c=$("#cd");if(c)c.textContent=cdText();
},10000);

/* ---------- pages ---------- */
const pagesEl=$("#pages");
function goPage(i){pagesEl.scrollTo({left:i*pagesEl.clientWidth,behavior:"smooth"})}
document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>goPage(+b.dataset.p));
pagesEl.addEventListener("scroll",()=>{const i=Math.round(pagesEl.scrollLeft/pagesEl.clientWidth);
  document.querySelectorAll(".nb").forEach((b,k)=>b.setAttribute("aria-current",k===i))},{passive:true});
function refresh(){
  const nb1=document.querySelector('.nb[data-p="1"]');if(nb1)nb1.lastChild.textContent=isFullMode()?"গ্রন্থ":"যাত্রা";
  renderHome();renderMap();renderPuja();renderRew()}

/* ---------- welcome ---------- */
function welcome(){
  const w=document.createElement("div");w.className="welcome";
  w.innerHTML=`${mascot()}
  <h1>গীতা পাঠশালা</h1>
  <p>আমি পেখম! ছোটদের জন্য গল্প আর খেলায় গীতা, বড়দের জন্য সম্পূর্ণ শ্রীমদ্ভগবদ্গীতা।</p>
  <div class="feat"><span>১২-র কম: শিশু পাঠ</span><span>১২+: সম্পূর্ণ গীতা</span><span>প্রিয় শ্লোক</span></div>
  ${S.invite?"":`<input id="wcode" placeholder="আমন্ত্রণ কোড (যেমন GITA-XXXX)" aria-label="আমন্ত্রণ কোড" maxlength="12" style="text-transform:uppercase">`}<input id="wname" placeholder="তোমার নাম লেখো" value="${S.name}" aria-label="তোমার নাম" maxlength="20">
  <input id="wage" placeholder="বয়স (যেমন ৯ বা ৩৫)" value="${S.age?BN(S.age):""}" aria-label="বয়স" inputmode="numeric" maxlength="3">
  <button class="cta" id="wgo">${S.name?"আবার শুরু করি":"চলো শুরু করি"}</button>`;
  document.body.appendChild(w);
  $("#wgo").onclick=()=>{if(!S.invite){const c=($("#wcode").value||"").trim().toUpperCase();if(!INVITE_CODES.includes(c)){toast("কোডটি সঠিক নয়। যিনি অ্যাপ দিয়েছেন তাঁর কাছ থেকে কোড নাও।");return}S.invite=c}S.name=$("#wname").value.trim()||S.name;const ag=parseInt(toENd($("#wage").value));
    if(!S.name){toast("তোমার নাম লেখো");return}
    if(!ag||ag<3||ag>110){toast("সঠিক বয়স লেখো (৩ থেকে ১১০)");return}
    if(ag!==S.age||!S.mode){S.age=ag;S.mode=ag<12?"kids":"full"}const k=todayKey();if(!S.days.includes(k))S.days.push(k);save();w.remove();refresh()};
}

initDeck();FULL=fallbackData();buildIndex();refresh();welcome();nativeSetup();loadFull();
</script>

<script>if("serviceWorker" in navigator&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
